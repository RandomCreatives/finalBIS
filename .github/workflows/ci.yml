name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch to keep the queue short.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        # Offline suite: Supabase is stubbed by tests/helpers.js — no DB needed.
        run: npm test

  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (runs ESLint via react-scripts)
        # CI=false so lint *warnings* don't fail the build — errors still do.
        run: npx react-scripts build
        env:
          CI: false

      - name: Unit tests
        run: npx react-scripts test --watchAll=false
        env:
          CI: true
