<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="48" y1="32" x2="464" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="52%" stop-color="#0f297a"/>
      <stop offset="100%" stop-color="#081642"/>
    </linearGradient>
    <radialGradient id="glowTop" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(132 104) rotate(42) scale(290)">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowLime" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(390 400) rotate(-135) scale(250)">
      <stop offset="0%" stop-color="#95c11f" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#95c11f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="40" y1="24" x2="472" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#95c11f" stop-opacity="0.32"/>
    </linearGradient>
    <linearGradient id="swoosh" x1="250" y1="100" x2="365" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b4dc37"/>
      <stop offset="55%" stop-color="#8fb91a"/>
      <stop offset="100%" stop-color="#6d9410"/>
    </linearGradient>
    <linearGradient id="globeFill" x1="196" y1="284" x2="322" y2="412" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Rounded glassmorphic tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glowTop)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glowLime)"/>
  <rect x="20" y="20" width="472" height="472" rx="108" stroke="url(#rim)" stroke-width="6"/>

  <!-- Subtle top glass sheen -->
  <path d="M128 24H384C438 24 480 66 484 120C390 156 268 166 28 132C34 70 76 24 128 24Z" fill="#ffffff" fill-opacity="0.06"/>

  <!-- Bold "B" -->
  <path fill="#ffffff" fill-rule="evenodd" clip-rule="evenodd"
    d="M84 100H156C185 100 205 115 205 139C205 155 196 168 180 174C200 180 212 195 212 215C212 243 189 260 155 260H84V100ZM123 130V162H149C161 162 167 156 167 146C167 136 161 130 149 130H123ZM123 193V229H152C165 229 173 222 173 211C173 199 165 193 152 193H123Z"/>

  <!-- Bold "I" -->
  <rect x="226" y="100" width="40" height="160" rx="6" fill="#ffffff"/>

  <!-- Signature BIS green "S" swoosh embracing the globe -->
  <path d="M408 130C386 110 346 104 316 118C287 131 280 160 296 182C311 202 346 212 378 226C420 245 440 290 428 346C414 408 352 442 276 440C210 438 156 406 140 360"
    stroke="url(#swoosh)" stroke-width="34" stroke-linecap="round" fill="none"/>

  <!-- Meridian Globe nestled inside the lower "S" bowl -->
  <g>
    <circle cx="272" cy="348" r="61" fill="url(#globeFill)" stroke="#ffffff" stroke-width="5"/>
    <!-- Equator & parallels -->
    <line x1="212" y1="348" x2="332" y2="348" stroke="#dbeafe" stroke-width="3.5" stroke-opacity="0.85"/>
    <path d="M222 322Q272 331 322 322" stroke="#dbeafe" stroke-width="3" stroke-opacity="0.75" fill="none"/>
    <path d="M222 374Q272 365 322 374" stroke="#dbeafe" stroke-width="3" stroke-opacity="0.75" fill="none"/>
    <!-- Central meridian & longitude arcs -->
    <line x1="272" y1="287" x2="272" y2="409" stroke="#dbeafe" stroke-width="3.5" stroke-opacity="0.85"/>
    <ellipse cx="272" cy="348" rx="30" ry="60" stroke="#dbeafe" stroke-width="3.2" stroke-opacity="0.8" fill="none"/>
  </g>
</svg>
